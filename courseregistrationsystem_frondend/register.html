
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="header">
    <h2>Course Registration System</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="register.html">Register</a>
        <a href="enrolled-students.html">Enrolled Students</a>
    </nav>
</header>

<main class="form-container">
    <p class="tagline">START YOUR JOURNEY</p>
    <h1>Student Registration</h1>
    <p>Enter your details and select a course.</p>

    <form id="registrationForm">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" name="studentName"
               placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="courseId">Select Course</label>
        <select id="courseId" name="courseId" required>
            <option value="">Loading courses...</option>
        </select>

        <button type="submit" class="btn" id="registerButton">
            Register Student
        </button>
    </form>

    <p id="registrationMessage" class="message" aria-live="polite"></p>
</main>

<footer>
    <p>Course Registration System</p>
</footer>

</body>
</html>
