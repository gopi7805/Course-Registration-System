
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="header">
    <h2>Course Registration System</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="register.html">Register</a>
        <a href="enrolled-students.html">Enrolled Students</a>
    </nav>
</header>

<main class="container">
    <div class="page-heading">
        <div>
            <p class="tagline">EXPLORE YOUR OPTIONS</p>
            <h1>Available Courses</h1>
            <p>Choose a course that matches your interest.</p>
        </div>
        <button class="btn" onclick="loadCourses()">Refresh Courses</button>
    </div>

    <p id="courseMessage" class="message" aria-live="polite"></p>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Course Name</th>
                    <th>Description</th>
                    <th>Duration</th>
                    <th>Fee</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="courseTable">
                <tr>
                    <td colspan="6">Loading courses...</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer>
    <p>Course Registration System</p>
</footer>

</body>
</html>
